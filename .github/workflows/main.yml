name: Ruby

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    env:
      BUNDLE_PATH: vendor/bundle
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Appraisal install
        run: bundle exec appraisal install

      - name: Lint
        run: bundle exec rubocop
      - name: Test with Gemfile.lock
        run: bundle exec rspec
      # Appraisal gemfiles are not committed and have no lockfile, so these runs resolve the newest versions the Gemfile allows.
      - name: Test with Appraisals
        run: bundle exec appraisal rspec
