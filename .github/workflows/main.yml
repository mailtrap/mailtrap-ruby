name: Ruby

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    env:
      BUNDLE_PATH: vendor/bundle
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Appraisal install
        run: bundle exec appraisal install

      - name: Lint
        run: bundle exec rubocop
      - name: Test with Gemfile.lock
        run: bundle exec rspec
      # Appraisal gemfiles are not committed, so these runs use the newest gem versions.
      - name: Test with Appraisals
        run: bundle exec appraisal rspec
